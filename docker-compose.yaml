version: "3.8"

# NocoDB Facturatie & Prognose — Coolify Deployment
# Separate from sb-platform and MapHub deployments

services:
  nocodb:
    image: nocodb/nocodb:2026.08.1
    restart: unless-stopped
    environment:
      NC_DB: "pg://nocodb-db:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
      NC_AUTH_JWT_SECRET: "${NC_AUTH_JWT_SECRET}"
      NC_PUBLIC_URL: "https://facturatie.studiobereikbaar.nl"
      NC_INVITE_ONLY_SIGNUP: "true"
      NC_REDIS_URL: "redis://nocodb-redis:6379"
      NC_SMTP_FROM: "${NC_SMTP_FROM}"
      NC_SMTP_HOST: "smtp.office365.com"
      NC_SMTP_PORT: "587"
      NC_SMTP_SECURE: "STARTTLS"
      NC_SMTP_USERNAME: "${NC_SMTP_USERNAME}"
      NC_SMTP_PASSWORD: "${NC_SMTP_PASSWORD}"
      NC_DISABLE_TELE: "true"
      NC_SECURE_ATTACHMENTS: "true"
      NC_DISABLE_AUDIT: "false"
      NC_CONNECTION_ENCRYPT_KEY: "${NC_CONNECTION_ENCRYPT_KEY}"
      # SSRF opt-ins (2026.x guards; sibling-container DB + internal webhook targets)
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"       # external data sources: sb_finance / smoke tests
      NC_WEBHOOK_ALLOW_PRIVATE_NETWORK: "true"  # promote-action webhook -> internal service (board v2)
      # SSO: NocoDB CE 2026.x ships no OIDC strategy (the NC_OIDC_* Entra block of 0.301.4 is dead
      # config, removed 2026-09-07). Identity is enforced in front by the `auth` service below
      # (Keycloak auth.studiobereikbaar.nl, brokers Entra) — Access-Planes RFC ruling 1.
    depends_on:
      nocodb-db:
        condition: service_healthy
      nocodb-redis:
        condition: service_started
    networks:
      - default
      - coolify
      - sb-internal   # sb_finance external source (v7, 2026-09-01)
    labels:
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Keycloak gate — same pattern as sb-viewer/docker-compose.nsl.yml (oauth2-proxy as reverse proxy,
  # repo-owned Traefik labels on the gate, the app itself has no public router).
  # Prereqs in Coolify env: OAUTH2_PROXY_CLIENT_SECRET (Keycloak client `facturatie`, realm maphub,
  # redirect URI https://facturatie.studiobereikbaar.nl/oauth2/callback) + OAUTH2_PROXY_COOKIE_SECRET
  # (32 random bytes, base64url). The Coolify domain on the `nocodb` service must be cleared, otherwise
  # Coolify's generated router bypasses the gate.
  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    depends_on:
      sso-bridge:
        condition: service_healthy
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.studiobereikbaar.nl/realms/maphub
      OAUTH2_PROXY_CLIENT_ID: facturatie
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_REDIRECT_URL: https://facturatie.studiobereikbaar.nl/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: facturatie.studiobereikbaar.nl
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://sso-bridge:8081/   # bridge → nocodb (single login, 2026-09-25)
      # sso-bridge trusts X-Forwarded-Email: the gate must set it from the Keycloak claim and strip
      # any client-sent copy (both are v7.6.0 defaults, pinned here on purpose)
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"   # straight to Keycloak/Microsoft, no interstitial
      OAUTH2_PROXY_WHITELIST_DOMAINS: facturatie.studiobereikbaar.nl
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: account
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "false"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.facturatie.rule=Host(`facturatie.studiobereikbaar.nl`)"
      - "traefik.http.routers.facturatie.entrypoints=https"
      - "traefik.http.routers.facturatie.tls.certresolver=letsencrypt"
      - "traefik.http.services.facturatie.loadbalancer.server.port=4180"

  # Single login: turns the gate's verified Keycloak email into a NocoDB session, so nobody sees
  # NocoDB's own password screen. Design, tests and limits: sso-bridge/server.js header.
  # INTERNAL ONLY: no coolify network, no Traefik labels. Anything that can reach this port can
  # claim any email, so only the `auth` service may talk to it.
  # Prereq: role nc_sso_bridge in the meta DB (sso-bridge/role.sql) + Coolify env
  # NC_SSO_BRIDGE_DB_PASSWORD (bws). Without it the bridge passes through = NocoDB's own login.
  sso-bridge:
    build: ./sso-bridge
    restart: unless-stopped
    depends_on:
      nocodb:
        condition: service_healthy
    environment:
      UPSTREAM: http://nocodb:8080
      PGHOST: nocodb-db
      PGDATABASE: "${POSTGRES_DB}"
      PGUSER: nc_sso_bridge
      PGPASSWORD: "${NC_SSO_BRIDGE_DB_PASSWORD}"
    networks:
      - default

  nocodb-db:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - nocodb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - coolify  # exposed for Metabase dashboard access

  nocodb-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - nocodb-redis-data:/data
    networks:
      - default

volumes:
  nocodb-db-data:
  nocodb-redis-data:

networks:
  coolify:
    external: true
  sb-internal:
    external: true
