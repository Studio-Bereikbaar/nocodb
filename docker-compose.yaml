version: "3.8"

# NocoDB Facturatie & Prognose — Coolify Deployment
# Separate from sb-platform and MapHub deployments

services:
  nocodb:
    image: nocodb/nocodb:2026.08.1
    restart: unless-stopped
    environment:
      NC_DB: "pg://nocodb-db:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
      NC_AUTH_JWT_SECRET: "${NC_AUTH_JWT_SECRET}"
      NC_PUBLIC_URL: "https://facturatie.studiobereikbaar.nl"
      NC_INVITE_ONLY_SIGNUP: "true"
      NC_REDIS_URL: "redis://nocodb-redis:6379"
      NC_SMTP_FROM: "${NC_SMTP_FROM}"
      NC_SMTP_HOST: "smtp.office365.com"
      NC_SMTP_PORT: "587"
      NC_SMTP_SECURE: "STARTTLS"
      NC_SMTP_USERNAME: "${NC_SMTP_USERNAME}"
      NC_SMTP_PASSWORD: "${NC_SMTP_PASSWORD}"
      NC_DISABLE_TELE: "true"
      NC_SECURE_ATTACHMENTS: "true"
      NC_DISABLE_AUDIT: "false"
      NC_CONNECTION_ENCRYPT_KEY: "${NC_CONNECTION_ENCRYPT_KEY}"
      # SSRF opt-ins (2026.x guards; sibling-container DB + internal webhook targets)
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"       # external data sources: sb_finance / smoke tests
      NC_WEBHOOK_ALLOW_PRIVATE_NETWORK: "true"  # promote-action webhook -> internal service (board v2)
      # Microsoft SSO (OIDC)
      NC_OIDC_ISSUER: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"
      NC_OIDC_AUTHORIZATION_URL: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize"
      NC_OIDC_TOKEN_URL: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token"
      NC_OIDC_USERINFO_URL: "https://graph.microsoft.com/oidc/userinfo"
      NC_OIDC_CLIENT_ID: "${AZURE_CLIENT_ID}"
      NC_OIDC_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"
      NC_OIDC_DISPLAY_NAME: "Studio Bereikbaar"
      NC_OIDC_SCOPE: "openid email profile"
    depends_on:
      nocodb-db:
        condition: service_healthy
      nocodb-redis:
        condition: service_started
    networks:
      - default
      - coolify
      - sb-internal   # sb_finance external source (v7, 2026-09-01)
    labels:
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nocodb-db:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - nocodb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - coolify  # exposed for Metabase dashboard access

  nocodb-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - nocodb-redis-data:/data
    networks:
      - default

volumes:
  nocodb-db-data:
  nocodb-redis-data:

networks:
  coolify:
    external: true
  sb-internal:
    external: true
